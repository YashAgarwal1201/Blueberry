<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueberry | CRUD using Express</title>
  <!-- Tailwind CSS CDN for utility-first styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Inter font */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      /* Light Theme Colors (Blueberry Palette) */
      --color-bg-primary: #f0f4f8;
      --color-bg-card: #ffffff;
      --color-text-primary: #2d3748;
      --color-text-secondary: #4a5568;
      --color-border: #e2e8f0;
      --color-accent: #4a55a8;
      --color-button-bg: #4a55a8;
      --color-button-hover: #3f4791;
      --color-danger: #dc2626;
      --color-danger-hover: #b91c1c;
    }

    .dark {
      /* Dark Theme Colors (Blueberry Palette) */
      --color-bg-primary: #1a202c;
      --color-bg-card: #2d3748;
      --color-text-primary: #e2e8f0;
      --color-text-secondary: #a0aec0;
      --color-border: #4a5568;
      --color-accent: #6b77c5;
      --color-button-bg: #6b77c5;
      --color-button-hover: #5a64a6;
      --color-danger: #ef4444;
      --color-danger-hover: #dc2626;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body class="transition-colors duration-300">

  <div class="min-h-screen flex flex-col items-center p-4 sm:p-6 bg-[var(--color-bg-primary)]">
    <div class="w-full max-w-2xl bg-[var(--color-bg-card)] rounded-xl shadow-lg p-6 sm:p-8 mt-8 border border-[var(--color-border)]">
      
      <!-- Header with title and theme toggle -->
      <header class="flex flex-col justify-between items-center gap-4 mb-6">
        <h1 class="text-3xl font-bold text-center sm:text-left text-[var(--color-text-primary)] mb-4 sm:mb-0">
          <i class="fas fa-list-check text-[var(--color-accent)] mr-2"></i> Blueberry - CRUD using Express
        </h1>
        <button id="theme-toggle" class="px-4 py-2 rounded-full border border-[var(--color-border)] text-sm font-medium transition-colors duration-300">
          <i class="fas fa-moon"></i> <span class="ml-2">Dark Mode</span>
        </button>
      </header>
      
      <!-- Status message area -->
      <div id="status-message" class="hidden mb-6 p-4 rounded-lg text-center transition-all duration-300"></div>

      <!-- Items List Section (READ) -->
      <section>
        <h2 class="text-xl font-semibold mb-4 text-[var(--color-text-secondary)] border-b pb-2 border-[var(--color-border)]">Current Items</h2>
        <ul id="items-list" class="space-y-3">
          <!-- Items will be dynamically populated here -->
        </ul>
      </section>

      <!-- Create New Item Section (POST) -->
      <section class="mt-8">
        <h2 class="text-xl font-semibold mb-4 text-[var(--color-text-secondary)] border-b pb-2 border-[var(--color-border)]">Create New Item</h2>
        <form id="createForm" class="flex flex-col sm:flex-row sm:space-x-4">
          <input type="text" id="createName" required placeholder="Enter item name" 
            class="flex-grow px-4 py-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] mb-4 sm:mb-0">
          <button type="submit" 
            class="px-6 py-2 rounded-lg font-semibold text-white bg-[var(--color-button-bg)] hover:bg-[var(--color-button-hover)] transition-colors duration-300">
            <i class="fas fa-plus mr-2"></i> Create
          </button>
        </form>
      </section>

      <!-- Update Item Section (PUT) -->
      <section class="mt-8">
        <h2 class="text-xl font-semibold mb-4 text-[var(--color-text-secondary)] border-b pb-2 border-[var(--color-border)]">Update Item</h2>
        <form id="updateForm" class="flex flex-col sm:flex-row sm:space-x-4">
          <input type="text" id="updateId" required placeholder="Item ID" 
            class="w-full sm:w-1/3 px-4 py-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] mb-4 sm:mb-0">
          <input type="text" id="updateName" required placeholder="New name" 
            class="w-full sm:w-2/3 px-4 py-2 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] mb-4 sm:mb-0">
          <button type="submit" 
            class="px-6 py-2 rounded-lg font-semibold text-white bg-[var(--color-button-bg)] hover:bg-[var(--color-button-hover)] transition-colors duration-300">
            <i class="fas fa-edit mr-2"></i> Update
          </button>
        </form>
      </section>
      
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/items';
    const itemsList = document.getElementById('items-list');
    const statusMessage = document.getElementById('status-message');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const createForm = document.getElementById('createForm');
    const updateForm = document.getElementById('updateForm');

    // Function to display status messages
    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.remove('hidden');
      if (isError) {
        statusMessage.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
        statusMessage.classList.remove('bg-green-100', 'text-green-800', 'border-green-300');
      } else {
        statusMessage.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
        statusMessage.classList.remove('bg-red-100', 'text-red-800', 'border-red-300');
      }
      setTimeout(() => {
        statusMessage.classList.add('hidden');
      }, 3000);
    }

    // Function to fetch and render all items (READ)
    async function fetchItems() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        itemsList.innerHTML = ''; // Clear the list
        if (data.length === 0) {
            itemsList.innerHTML = '<li class="text-center text-sm italic text-[var(--color-text-secondary)]">No items found. Create one above!</li>';
            return;
        }
        data.forEach(item => {
          const li = document.createElement('li');
          li.className = 'flex justify-between items-center p-4 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg-card)] transition-colors duration-200 shadow-sm';
          li.innerHTML = `
            <span class="text-[var(--color-text-primary)] font-medium">ID: ${item.id} | Name: ${item.name}</span>
            <div class="flex space-x-2">
              <button data-id="${item.id}" class="delete-btn bg-[var(--color-danger)] text-white px-3 py-1 text-sm rounded-lg font-semibold hover:bg-[var(--color-danger-hover)] transition-colors duration-200">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          `;
          itemsList.appendChild(li);
        });
      } catch (error) {
        console.error('Failed to fetch items:', error);
        showStatus('Failed to load items. Is the Express server running?', true);
      }
    }

    // Handle Create (POST)
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('createName').value;
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          showStatus('Item created successfully!');
          createForm.reset();
          fetchItems(); // Refresh the list
        } else {
          const errorText = await res.text();
          showStatus(`Error creating item: ${errorText}`, true);
        }
      } catch (error) {
        showStatus('Failed to connect to the server.', true);
      }
    });

    // Handle Update (PUT)
    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('updateId').value;
      const name = document.getElementById('updateName').value;
      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (res.ok) {
          showStatus('Item updated successfully!');
          updateForm.reset();
          fetchItems(); // Refresh the list
        } else {
          const errorText = await res.text();
          showStatus(`Error updating item: ${errorText}`, true);
        }
      } catch (error) {
        showStatus('Failed to connect to the server.', true);
      }
    });
    
    // Handle Delete (DELETE) using event delegation
    itemsList.addEventListener('click', async (e) => {
        if (e.target.closest('.delete-btn')) {
            const button = e.target.closest('.delete-btn');
            const id = button.getAttribute('data-id');
            if (!confirm('Are you sure you want to delete this item?')) {
                return;
            }
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showStatus('Item deleted successfully!');
                    fetchItems(); // Refresh the list
                } else {
                    const errorText = await res.text();
                    showStatus(`Error deleting item: ${errorText}`, true);
                }
            } catch (error) {
                showStatus('Failed to connect to the server.', true);
            }
        }
    });

    // Theme Toggle Functionality
    function toggleTheme() {
        document.body.classList.toggle('dark');
        const isDarkMode = document.body.classList.contains('dark');
        themeToggleBtn.innerHTML = isDarkMode ? '<i class="fas fa-sun"></i> <span class="ml-2">Light Mode</span>' : '<i class="fas fa-moon"></i> <span class="ml-2">Dark Mode</span>';
        localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
    }

    themeToggleBtn.addEventListener('click', toggleTheme);

    // Initial page load setup
    document.addEventListener('DOMContentLoaded', () => {
      // Check for saved theme preference
      if (localStorage.getItem('theme') === 'dark') {
          document.body.classList.add('dark');
          themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i> <span class="ml-2">Light Mode</span>';
      }
      fetchItems();
    });
  </script>
</body>
</html>
